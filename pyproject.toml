[project]
name = "enterprise-task-api"
version = "1.0.0"
description = "Enterprise Task & Project Orchestration REST API built with Clean Architecture, FastAPI, SQLAlchemy 2.0, and Pydantic V2."
readme = "README.md"
authors = [{ name = "Enterprise Engineering Team", email = "dev@taskorchestrator.io" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "greenlet>=3.1.0",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
    "rich>=13.9.0",
    "sqlalchemy>=2.0.36",
    "typer>=0.12.5",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
enterprise-cli = "enterprise_api.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_api"]

# ==========================================
# Ruff Linter & Formatter Configuration
# Inspired by astral-sh/ruff & tiangolo/fastapi
# ==========================================
[tool.ruff]
target-version = "py312"
line-length = 95
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "B008",   # Do not perform function calls in argument defaults (FastAPI Depends)
    "RUF012", # Mutable class attributes (Pydantic / SQLAlchemy models)
    "UP007",  # Use X | Y for type annotations
    "ARG001", # Unused fixture arguments in pytest
    "E501",   # Line length (handled by ruff format)
    "UP042",  # StrEnum upgrade
    "UP046",  # PEP 695 generic syntax
]

[tool.ruff.lint.isort]
known-first-party = ["enterprise_api"]

# ==========================================
# Pytest Configuration
# ==========================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
addopts = "-v --cov=enterprise_api --cov-report=term-missing --cov-report=html"

# ==========================================
# Coverage Configuration
# ==========================================
[tool.coverage.run]
source = ["enterprise_api"]
branch = true
omit = [
    "*/cli.py",
    "*/main.py",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ==========================================
# Mypy Type Checker Configuration
# ==========================================
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
